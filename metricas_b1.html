<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#f7f7f5;color:#595959;min-height:100vh;padding:56px 20px 48px}
.back{position:fixed;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;color:#fff;background:#7668AC;border:none;border-radius:8px;padding:7px 14px;text-decoration:none;box-shadow:0 2px 6px rgba(118,104,172,.4);z-index:9999;transition:opacity .15s}
.container{width:100%;max-width:640px;margin:0 auto}
.hero{background:#7668AC;border-radius:20px;padding:28px 28px 24px;margin-bottom:22px}
.hero-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.3px;margin-bottom:2px}
.hero-sub{font-size:12px;color:rgba(255,255,255,.75);font-weight:600}
.sec-label{font-size:10px;font-weight:800;color:#9a9a9a;text-transform:uppercase;letter-spacing:1.5px;margin:20px 0 10px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-card{background:#fff;border:none;border-radius:14px;padding:24px 18px;text-decoration:none;color:#595959;box-shadow:0 2px 8px rgba(89,89,89,.08);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:all .2s;position:relative;overflow:hidden}
.btn-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:#7668AC;border-radius:14px 14px 0 0}
.btn-card.geral::before{background:#65a30d}
.btn-card.receita::before{background:#E87A20}
.btn-card.eventos::before{background:#008ECF}
.btn-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(118,104,172,.2)}
.btn-card .title{font-size:15px;font-weight:800;color:#595959}
.btn-card .sub{font-size:11px;color:#9a9a9a;line-height:1.6;font-weight:500}
@media(max-width:480px){.btn-grid{grid-template-columns:1fr}}
html.dark body{background:#18181b;color:#d4d4d0}
html.dark .btn-card{background:#1e1e22;color:#d4d4d0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
html.dark .btn-card .title{color:#d4d4d0}
html.dark .btn-card .sub{color:#71717a}
html.dark .sec-label{color:#71717a}
</style>
<script>(function(){var t=localStorage.getItem('cs_ops_theme');if(t==='dark')document.documentElement.classList.add('dark')})();</script></head>

    </a>
  </div>
</div>
